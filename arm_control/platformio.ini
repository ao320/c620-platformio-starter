[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; ID4 elbow image: 1000 motor RPM fixed overspeed shutdown; motor actuation
; still requires an approved exact test and confirmed physical support.
build_flags = -DARM_ENABLE_ACTUATION=1 -DARM_ENABLE_STANDALONE=0 -DARM_ENABLE_GRAVITY_PROFILE=1
